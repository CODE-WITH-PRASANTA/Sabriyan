<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Sabriyana brings you pure, natural honey sourced from nature with care, quality, and sustainable beekeeping practices."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#173b1a"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- =====================================================
         LCP HERO IMAGE PRELOAD
         Matches the hero <img> srcSet in OurProducts.jsx
         ===================================================== -->

    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1548907040-4baa42d10919?auto=format&fit=crop&w=480&q=45&fm=webp"
      imagesrcset="
        https://images.unsplash.com/photo-1548907040-4baa42d10919?auto=format&fit=crop&w=480&q=45&fm=webp 480w,
        https://images.unsplash.com/photo-1548907040-4baa42d10919?auto=format&fit=crop&w=1000&q=55&fm=webp 1000w
      "
      imagesizes="100vw"
      fetchpriority="high"
      type="image/webp"
    />

    <title>Sabriyana | Pure Natural Honey</title>

    <!-- =====================================================
         CRITICAL INITIAL PAINT CSS
         ===================================================== -->

    <style>
      html {
        background: #07160d;
      }

      body {
        margin: 0;
        background: #07160d;
        color: #173b1a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      #root {
        min-height: 100vh;
      }

      img {
        max-width: 100%;
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
